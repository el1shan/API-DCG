# This rule is not used by the project api-dcg itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the driftguard.api.dcg.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: api-dcg
    app.kubernetes.io/managed-by: kustomize
  name: driftpolicy-editor-role
rules:
- apiGroups:
  - driftguard.api.dcg
  resources:
  - driftpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - driftguard.api.dcg
  resources:
  - driftpolicies/status
  verbs:
  - get
